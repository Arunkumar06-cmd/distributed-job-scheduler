[workspace]
members = ["common", "domain", "db", "outbox", "worker", "scheduler", "api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-nats = "0.38"
futures = "0.3"
bytes = "1"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
validator = { version = "0.18", features = ["derive"] }
cron = "0.12"
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
