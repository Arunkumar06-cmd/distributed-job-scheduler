services:
  - type: web
    name: jobflow
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.all-in-one
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_PORT
        value: "8080"
      - key: AI_SUMMARIES_ENABLED
        value: "false"

databases:
  - name: jobflow-db
    databaseName: job_scheduler
    user: jobflow
    plan: free
